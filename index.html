<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #70c5ce; overflow: hidden; }
  #wrap { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  canvas { display: block; background: #70c5ce; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');

var BASE_W = 360, BASE_H = 640;
var W, H, scale;

function resize() {
  var vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / BASE_W, vh / BASE_H);
  W = Math.floor(BASE_W * scale);
  H = Math.floor(BASE_H * scale);
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

var bird, pipes, score, best, state, frame;
var GRAVITY = 0.35, JUMP = -6.5, PIPE_W = 60, PIPE_GAP = 150, PIPE_SPEED = 2.2;
var startBtn = { x: BASE_W/2 - 70, y: BASE_H/2 + 40, w: 140, h: 50 };

best = parseInt(localStorage.getItem('flappyBest') || '0');

var birdImgs = [];
var startImg = new Image();
var loaded = 0;
var totalImgs = 4;

for (var i = 1; i <= 3; i++) {
  (function(idx) {
    var img = new Image();
    img.src = idx + '.png';
    img.onload = function() { loaded++; checkReady(); };
    img.onerror = function() { loaded++; checkReady(); };
    birdImgs.push(img);
  })(i);
}

startImg.src = 'start.png';
startImg.onload = function() { loaded++; checkReady(); };
startImg.onerror = function() { loaded++; checkReady(); };

function checkReady() {
  if (loaded >= totalImgs) {
    state = 'ready';
    init();
    loop();
  }
}

function init() {
  bird = { x: 80, y: BASE_H/2, vy: 0, r: 14, angle: 0 };
  pipes = [];
  score = 0;
  frame = 0;
}

function startGame() {
  init();
  state = 'playing';
  bird.vy = JUMP;
}

function spawnPipe() {
  var minTop = 60;
  var maxTop = BASE_H - PIPE_GAP - 120;
  var top = Math.random() * (maxTop - minTop) + minTop;
  pipes.push({ x: BASE_W, top: top, passed: false });
}

function update() {
  if (state !== 'playing') return;
  frame++;
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.angle = Math.min(Math.max(bird.vy * 0.08, -0.5), 1.2);

  if (frame % 90 === 0) spawnPipe();

  for (var i = pipes.length - 1; i >= 0; i--) {
    var p = pipes[i];
    p.x -= PIPE_SPEED;

    if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; }
    if (p.x + PIPE_W < 0) pipes.splice(i, 1);

    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W) {
      if (bird.y - bird.r < p.top || bird.y + bird.r > p.top + PIPE_GAP) {
        gameOver();
      }
    }
  }
  if (bird.y + bird.r > BASE_H || bird.y - bird.r < 0) gameOver();
}

function gameOver() {
  state = 'over';
  if (score > best) { best = score; localStorage.setItem('flappyBest', best); }
}

function drawBird() {
  var img = birdImgs[Math.floor(frame / 6) % 3];
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.angle);
  if (img && img.complete && img.naturalWidth > 0) {
    var w = 44, h = 34;
    ctx.drawImage(img, -w/2, -h/2, w, h);
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.scale(scale, scale);

  if (state === 'ready') {
    if (startImg.complete && startImg.naturalWidth > 0) {
      var sw = 200, sh = 80;
      ctx.drawImage(startImg, BASE_W/2 - sw/2, BASE_H/2 - 40, sw, sh);
    }
    ctx.restore();
    return;
  }

  drawBird();

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function flap() {
  if (state === 'playing') bird.vy = JUMP;
}

function handleStart() {
  if (state === 'ready' || state === 'over') startGame();
}

function getPos(e) {
  var rect = canvas.getBoundingClientRect();
  var cx = e.touches ? e.touches[0].clientX : e.clientX;
  var cy = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (cx - rect.left) * (BASE_W / rect.width),
    y: (cy - rect.top) * (BASE_H / rect.height)
  };
}

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  var pos = getPos(e);
  if (state === 'ready') {
    if (pos.x >= startBtn.x && pos.x <= startBtn.x + startBtn.w &&
        pos.y >= startBtn.y && pos.y <= startBtn.y + startBtn.h) {
      handleStart();
    }
  } else if (state === 'over') {
    handleStart();
  } else {
    flap();
  }
}, { passive: false });

canvas.addEventListener('mousedown', function(e) {
  var pos = getPos(e);
  if (state === 'ready') {
    if (pos.x >= startBtn.x && pos.x <= startBtn.x + startBtn.w &&
        pos.y >= startBtn.y && pos.y <= startBtn.y + startBtn.h) {
      handleStart();
    }
  } else if (state === 'over') {
    handleStart();
  } else {
    flap();
  }
});

document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'playing') flap();
    else handleStart();
  }
});
</script>
</body>
</html>
