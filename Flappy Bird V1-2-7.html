<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #70c5ce; overflow: hidden; }
  #wrap { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  canvas { display: block; background: #70c5ce; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');

var BASE_W = 360, BASE_H = 640;
var W, H, scale;

function resize() {
  var vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / BASE_W, vh / BASE_H);
  W = Math.floor(BASE_W * scale);
  H = Math.floor(BASE_H * scale);
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

var bird, pipes, score, best, state, frame;
var GRAVITY = 0.18, JUMP = -5.2, PIPE_W = 60, PIPE_GAP = 150, PIPE_SPEED = 2.2;
var startBtn = { x: 110, y: 360, w: 140, h: 50 };

best = parseInt(localStorage.getItem('flappyBest') || '0');

var birdImgs = [];
var startImg = new Image();
var loaded = 0;
var totalImgs = 4;

for (var i = 1; i <= 3; i++) {
  (function(idx) {
    var img = new Image();
    img.src = idx + '.png';
    img.onload = function() { loaded++; checkReady(); };
    img.onerror = function() { loaded++; checkReady(); };
    birdImgs.push(img);
  })(i);
}

startImg.src = 'start.png';
startImg.onload = function() { loaded++; checkReady(); };
startImg.onerror = function() { loaded++; checkReady(); };

function checkReady() {
  if (loaded >= totalImgs) {
    state = 'ready';
    init();
    loop();
  }
}

function init() {
  bird = { x: 80, y: BASE_H/2, vy: 0, r: 14, angle: 0 };
  pipes = [];
  score = 0;
  frame = 0;
}

function startGame() {
  init();
  state = 'playing';
  bird.vy = JUMP;
}

function spawnPipe() {
  var minTop = 60;
  var maxTop = BASE_H - PIPE_GAP - 120;
  var top = Math.random() * (maxTop - minTop) + minTop;
  pipes.push({ x: BASE_W, top: top, passed: false });
}

function update() {
  if (state !== 'playing') return;
  frame++;
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.angle = Math.min(Math.max(bird.vy * 0.08, -0.5), 1.2);

  if (frame % 100 === 0) spawnPipe();

  for (var i = pipes.length - 1; i >= 0; i--) {
    var p = pipes[i];
    p.x -= PIPE_SPEED;
    if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; }
    if (p.x + PIPE_W < 0) pipes.splice(i, 1);
    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W) {
      if (bird.y - bird.r < p.top || bird.y + bird.r > p.top + PIPE_GAP) {
        gameOver();
      }
    }
  }
  if (bird.y + bird.r > BASE_H || bird.y - bird.r < 0) gameOver();
}

function gameOver() {
  state = 'over';
  if (score > best) { best = score; localStorage.setItem('flappyBest', best); }
}

function drawBird() {
  var img = birdImgs[Math.floor(frame / 6) % 3];
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.angle);
  if (img && img.complete && img.naturalWidth > 0) {
    var w = 160, h = 160;
    ctx.drawImage(img, -w/2, -h/2, w, h);
  }
  ctx.restore();
}

function drawPipes() {
  for (var i = 0; i < pipes.length; i++) {
    var p = pipes[i];

    var grad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    grad.addColorStop(0, '#7ed957');
    grad.addColorStop(0.4, '#5aa832');
    grad.addColorStop(1, '#3d7a20');

    ctx.fillStyle = grad;
    ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.fillRect(p.x, p.top - 25, PIPE_W, 25);

    ctx.strokeStyle = '#2d5c16';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, 0, PIPE_W, p.top);
    ctx.strokeRect(p.x, p.top - 25, PIPE_W, 25);

    var bottomY = p.top + PIPE_GAP;
    ctx.fillStyle = grad;
    ctx.fillRect(p.x, bottomY, PIPE_W, BASE_H - bottomY);
    ctx.fillRect(p.x, bottomY, PIPE_W, 25);

    ctx.strokeRect(p.x, bottomY, PIPE_W, BASE_H - bottomY);
    ctx.strokeRect(p.x, bottomY, PIPE_W, 25);

    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(p.x + 8, 0, 8, p.top - 25);
    ctx.fillRect(p.x + 8, bottomY + 25, 8, BASE_H - bottomY - 25);
  }
}

function drawGround() {
  var grad = ctx.createLinearGradient(0, BASE_H - 40, 0, BASE_H);
  grad.addColorStop(0, '#e8d98a');
  grad.addColorStop(1, '#c9b85a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, BASE_H - 40, BASE_W, 40);

  ctx.fillStyle = '#b8a84a';
  for (var x = 0; x < BASE_W; x += 40) {
    var offset = (frame * 0.5) % 40;
    ctx.fillRect(x + offset, BASE_H - 40, 20, 8);
  }
}

function drawBackground() {
  var sky = ctx.createLinearGradient(0, 0, 0, BASE_H);
  sky.addColorStop(0, '#4ec0ca');
  sky.addColorStop(0.7, '#70c5ce');
  sky.addColorStop(1, '#a8e0e8');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  var cloudX = (frame * 0.3) % (BASE_W + 120) - 60;
  drawCloud(cloudX, 120, 30);
  drawCloud(cloudX + 180, 200, 22);
  drawCloud(cloudX + 90, 320, 26);
}

function drawCloud(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.arc(x + r * 0.8, y + 4, r * 0.7, 0, Math.PI * 2);
  ctx.arc(x - r * 0.8, y + 4, r * 0.6, 0, Math.PI * 2);
  ctx.fill();
}

function drawStart() {
  drawBackground();

  if (startImg.complete && startImg.naturalWidth > 0) {
    var btnW = 120;
    var btnH = btnW * 16 / 9;
    var btnX = BASE_W / 2 - btnW / 2;
    var btnY = BASE_H / 2 - btnH / 2;
    ctx.drawImage(startImg, btnX, btnY, btnW, btnH);
    startBtn.x = btnX;
    startBtn.y = btnY;
    startBtn.w = btnW;
    startBtn.h = btnH;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.scale(scale, scale);

  if (state === 'ready') {
    drawStart();
    ctx.restore();
    return;
  }

  drawBackground();
  drawPipes();
  drawGround();
  drawBird();

  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.font = 'bold 36px Arial';
  ctx.textAlign = 'center';
  ctx.strokeText(score, BASE_W/2, 80);
  ctx.fillText(score, BASE_W/2, 80);

  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = 'bold 32px Arial';
    ctx.textAlign = 'center';
    ctx.strokeText('游戏结束', BASE_W/2, BASE_H/2 - 60);
    ctx.fillText('游戏结束', BASE_W/2, BASE_H/2 - 60);
    ctx.font = 'bold 22px Arial';
    ctx.strokeText('得分: ' + score, BASE_W/2, BASE_H/2 - 10);
    ctx.fillText('得分: ' + score, BASE_W/2, BASE_H/2 - 10);
    ctx.strokeText('最高: ' + best, BASE_W/2, BASE_H/2 + 25);
    ctx.fillText('最高: ' + best, BASE_W/2, BASE_H/2 + 25);
    ctx.font = 'bold 18px Arial';
    ctx.strokeText('点击重新开始', BASE_W/2, BASE_H/2 + 80);
    ctx.fillText('点击重新开始', BASE_W/2, BASE_H/2 + 80);
  }

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function flap() {
  if (state === 'playing') bird.vy = JUMP;
}

function handleStart() {
  if (state === 'ready' || state === 'over') startGame();
}

function getPos(e) {
  var rect = canvas.getBoundingClientRect();
  var cx = e.touches ? e.touches[0].clientX : e.clientX;
  var cy = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (cx - rect.left) * (BASE_W / rect.width),
    y: (cy - rect.top) * (BASE_H / rect.height)
  };
}

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  var pos = getPos(e);
  if (state === 'ready') {
    if (pos.x >= startBtn.x && pos.x <= startBtn.x + startBtn.w &&
        pos.y >= startBtn.y && pos.y <= startBtn.y + startBtn.h) {
      handleStart();
    }
  } else if (state === 'over') {
    handleStart();
  } else {
    flap();
  }
}, { passive: false });

canvas.addEventListener('mousedown', function(e) {
  var pos = getPos(e);
  if (state === 'ready') {
    if (pos.x >= startBtn.x && pos.x <= startBtn.x + startBtn.w &&
        pos.y >= startBtn.y && pos.y <= startBtn.y + startBtn.h) {
      handleStart();
    }
  } else if (state === 'over') {
    handleStart();
  } else {
    flap();
  }
});

document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'playing') flap();
    else handleStart();
  }
});
</script>
</body>
</html>
